<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toroidal Snake - Play</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="score-board">
      <span>Score: <span id="score">0</span></span>
      <span>High Score: <span id="highscore">0</span></span>
      <button id="infoToggleBtn" class="info-btn" aria-label="Souls info">i</button>
      <button id="adminToggleBtn" class="info-btn admin-toggle hidden" aria-label="Admin tools">⚙</button>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="dpad">
      <button id="upBtn" class="dpad-btn dpad-up">▲</button>
      <button id="leftBtn" class="dpad-btn dpad-left">◀</button>
      <button id="rightBtn" class="dpad-btn dpad-right">▶</button>
      <button id="downBtn" class="dpad-btn dpad-down">▼</button>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <a href="index.html" class="btn-link secondary">Menu</a>
    </div>

    <div id="gameOverModal" class="modal hidden">
      <div class="modal-content">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div id="soulsPanel" class="souls-panel hidden">
    <div class="souls-panel-header">
      <h2>Souls</h2>
      <button id="closeInfoBtn" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="souls-tabs">
      <button class="souls-tab active" data-tab="active">Active Souls</button>
      <button class="souls-tab" data-tab="villain">Villain Souls</button>
      <button class="souls-tab" data-tab="collectibles">Collectibles</button>
    </div>
    <ul id="soulsList" class="souls-list"></ul>
  </div>

  <div id="adminPanel" class="admin-panel hidden">
    <div class="admin-panel-header">
      <h3>Admin — Test Tools</h3>
      <button id="closeAdminBtn" class="close-btn" aria-label="Close">&times;</button>
    </div>

    <div class="admin-row">
      <label for="adminLengthInput">Length</label>
      <input id="adminLengthInput" type="number" min="1" max="200" value="3" />
      <button id="adminSetLengthBtn">Set</button>
    </div>

    <p class="admin-label">Trigger a soul:</p>
    <div class="admin-soul-buttons" id="adminSoulButtons"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
