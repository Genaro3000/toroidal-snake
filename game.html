<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toroidal Snake - Play</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="infoToggleBtn" class="info-toggle" aria-label="Souls info">i</button>

  <div class="game-container">
    <div class="score-board">
      <span>Score: <span id="score">0</span></span>
      <span>High Score: <span id="highscore">0</span></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="dpad">
      <button id="upBtn" class="dpad-btn dpad-up">▲</button>
      <button id="leftBtn" class="dpad-btn dpad-left">◀</button>
      <button id="rightBtn" class="dpad-btn dpad-right">▶</button>
      <button id="downBtn" class="dpad-btn dpad-down">▼</button>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <a href="index.html" class="btn-link secondary">Menu</a>
    </div>

    <div id="gameOverModal" class="modal hidden">
      <div class="modal-content">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div id="soulsPanel" class="souls-panel hidden">
    <div class="souls-panel-header">
      <h2>Souls</h2>
      <button id="closeInfoBtn" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <ul id="soulsList" class="souls-list"></ul>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
