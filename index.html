<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toroidal Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>🐍 Toroidal Snake</h1>
    <p class="subtitle">Exit one side, enter the other</p>
    <canvas id="previewCanvas" width="120" height="120"></canvas>
    <p id="greeting" class="greeting hidden"></p>
    <div class="controls">
      <a href="game.html" class="btn-link">Play</a>
      <button id="leaderboardBtn" class="btn-link secondary">🏆 Leaderboard</button>
    </div>
  </div>

  <div id="nameModal" class="modal hidden">
    <div class="modal-content">
      <h2>Welcome!</h2>
      <p>What should we call you?</p>
      <input id="nameInput" type="text" placeholder="Your Discord name" maxlength="20" />
      <button id="nameSubmitBtn">Let's go</button>
    </div>
  </div>

  <div id="leaderboardModal" class="modal hidden">
    <div class="modal-content">
      <h2>Top 10</h2>
      <ol id="leaderboardList">
        <li>Loading...</li>
      </ol>
      <button id="closeLeaderboardBtn" class="btn-link secondary">Close</button>
    </div>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
