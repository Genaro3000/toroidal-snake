<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>🐍 Ghost Snake</h1>
    <canvas id="previewCanvas" width="120" height="120"></canvas>
    <p id="greeting" class="greeting hidden"></p>
    <div class="controls">
      <a href="game.html" class="btn-link">Play</a>
      <button id="leaderboardBtn" class="btn-link secondary">🏆 Leaderboard</button>
      <button id="customizeBtn" class="btn-link secondary">🎨 Customize</button>
    </div>
  </div>

  <div id="nameModal" class="modal hidden">
    <div class="modal-content">
      <h2>Welcome!</h2>
      <p>What should we call you?</p>
      <input id="nameInput" type="text" placeholder="Your Discord name" maxlength="20" />
      <button id="nameSubmitBtn">Let's go</button>
    </div>
  </div>

  <div id="leaderboardModal" class="modal hidden">
    <div class="modal-content">
      <h2>Top 10</h2>
      <ol id="leaderboardList">
        <li>Loading...</li>
      </ol>
      <button id="closeLeaderboardBtn" class="btn-link secondary">Close</button>
    </div>
  </div>

  <div id="customizeModal" class="modal hidden">
    <div class="modal-content customize-content">
      <div class="souls-panel-header">
        <h2>Customize</h2>
        <button id="closeCustomizeBtn" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <p class="admin-label">Tap an unlocked cosmetic to equip/unequip it. Pattern, Shape and Glow only allow one at a time.</p>
      <ul id="customizeList" class="souls-list"></ul>
    </div>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
